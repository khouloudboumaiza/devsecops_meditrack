services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meditrack
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: meditrack_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditrack -d meditrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://meditrack:meditrack_dev_password@db:5432/meditrack
      JWT_SECRET: dev_secret_fictif
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node db/seed.js && node src/app.js"

volumes:
  pgdata: