services:

  # =========================
  # PostgreSQL DATABASE
  # =========================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meditrack
      POSTGRES_USER: meditrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U meditrack -d meditrack" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # MEDITrack APPLICATION
  # =========================
  app:
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: meditrack
      PGDATABASE: meditrack
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
      JWT_SECRET: ${JWT_SECRET:?Definissez JWT_SECRET dans .env}
      API_KEY: ${API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node db/seed.js && node src/app.js"

  # =========================
  # PROMETHEUS
  # =========================
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
      - postgres-exporter
      - cadvisor
      - alertmanager

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  alertmanager:
   image: prom/alertmanager:v0.27.0
   restart: unless-stopped
   volumes:
    - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
   ports:
    - "9093:9093"
   env_file:
    - .env
   command:
    - "--config.file=/etc/alertmanager/alertmanager.yml"
    # - "--config.expand-env"

  # =========================
  # GRAFANA
  # =========================
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Definissez GRAFANA_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # =========================
  # POSTGRES EXPORTER
  # =========================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "db:5432/meditrack?sslmode=disable"
      DATA_SOURCE_USER: meditrack
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Definissez POSTGRES_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy

  # =========================
  # CADVISOR
  # =========================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # =========================
  # PORTAINER - CONTAINER MANAGEMENT
  # =========================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      # Accès à l'API Docker pour gérer les conteneurs
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistance des données Portainer
      - portainer_data:/data

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  portainer_data:
