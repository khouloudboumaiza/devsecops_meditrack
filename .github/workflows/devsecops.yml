# =============================================================================
#  MediTrack - Pipeline DevSecOps (équivalent GitHub Actions du .gitlab-ci.yml)
#  Le dépôt de l'équipe est sur GitHub : ce workflow permet d'exécuter le même
#  pipeline (mêmes outils, mêmes versions, même politique de blocage).
#
#  Les scanners sont lancés via leurs images Docker officielles à version FIXÉE,
#  sans actions tierces (ex. trivy-action a été compromise en mars 2026,
#  CVE-2026-33634) : moins de dépendances = surface d'attaque réduite.
# =============================================================================
name: DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0
  SEMGREP_IMAGE: semgrep/semgrep:1.184.0

jobs:
  # ------------------------------- BUILD -------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image Docker
        run: docker build -t meditrack:${{ github.sha }} .
      - name: Vérifier que l'image ne tourne pas en root
        run: test "$(docker run --rm --entrypoint whoami meditrack:${{ github.sha }})" != "root"
      - name: Sauvegarder l'image pour les jobs suivants
        run: docker save meditrack:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with: { name: image, path: image.tar, retention-days: 1 }

  # -------------------------------- TEST -------------------------------------
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: find src db -name "*.js" -exec node --check {} \;
      - name: Démarrage + /health + /metrics
        run: |
          PORT=3000 node src/app.js > app.log 2>&1 &
          sleep 5
          curl -fsS http://localhost:3000/health | grep -q ok
          curl -fsS http://localhost:3000/metrics | grep -q http_requests_total

  # -------------------------------- SCAN -------------------------------------
  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tout l'historique Git
      - name: Gitleaks (BLOQUANT si secret)
        run: |
          docker run --rm -v "$PWD":/src -w /src --entrypoint sh "$GITLEAKS_IMAGE" -c \
            "git config --global --add safe.directory /src && gitleaks git . --config .gitleaks.toml --redact --verbose --report-format json --report-path gitleaks-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gitleaks-report, path: gitleaks-report.json }

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rapport Semgrep complet
        run: |
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD":/src -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep/meditrack-rules.yml --config p/javascript \
            --config p/expressjs --config p/nodejs --json --output semgrep-report.json || true
      - name: Semgrep (BLOQUANT si sévérité ERROR)
        run: |
          docker run --rm -e SEMGREP_SEND_METRICS=off -v "$PWD":/src -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config .semgrep/meditrack-rules.yml --config p/javascript \
            --config p/expressjs --config p/nodejs --severity ERROR --error
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: semgrep-report, path: semgrep-report.json }

  sca-npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm audit --omit=dev || true
      - name: npm audit (BLOQUANT si CRITICAL)
        run: npm audit --omit=dev --audit-level=critical

  sca-trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs - HIGH (avertissement)
        continue-on-error: true
        run: docker run --rm -v "$PWD":/src -w /src "$TRIVY_IMAGE" fs --scanners vuln --severity HIGH --exit-code 0 .
      - name: Trivy fs - CRITICAL (BLOQUANT)
        run: docker run --rm -v "$PWD":/src -w /src "$TRIVY_IMAGE" fs --scanners vuln --severity CRITICAL --exit-code 1 .

  scan-trivy-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      - run: docker load -i image.tar
      - name: Trivy image - HIGH (avertissement)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH --exit-code 0 meditrack:${{ github.sha }}
      - name: Trivy image - CRITICAL (BLOQUANT)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity CRITICAL --exit-code 1 meditrack:${{ github.sha }}

  # ------------------------------- DEPLOY ------------------------------------
  # Uniquement sur main et uniquement si TOUS les contrôles bloquants sont verts.
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, smoke-test, secrets-gitleaks, sast-semgrep, sca-npm-audit, sca-trivy-fs, scan-trivy-image]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: image }
      - run: docker load -i image.tar
      - name: Publier l'image validée (GitHub Container Registry)
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag meditrack:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
          echo "Image validée et publiée : $IMAGE"
